<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <style>
    body { width: 420px; font-family: Arial, sans-serif; padding: 10px; background: #1e1e1e; color: #ddd; }
    h1 { font-size: 15px; margin: 0 0 10px; color: #fff; }
    .info { font-size: 12px; color: #aaa; margin-bottom: 10px; }
    .loading { display: none; text-align: center; color: #4a90e2; margin: 20px 0; font-weight: bold; }
    .options { background: #2a2a2a; padding: 8px; border-radius: 4px; margin-bottom: 10px; display: flex; gap: 10px; font-size: 11px; align-items: center;}
    .controls { margin-bottom: 10px; display: flex; gap: 10px; }
    button { background: #4a90e2; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; }
    button:hover { background: #357ab8; }
    .btn-download { background: #28a745; width: 100%; padding: 10px; font-size: 14px; font-weight: bold; margin-top: 10px;}
    #list { max-height: 300px; overflow-y: auto; border: 1px solid #444; border-radius: 4px; background: #2a2a2a; padding: 5px; }
    .item { display: flex; align-items: center; gap: 10px; padding: 5px; border-bottom: 1px solid #333; font-size: 12px; }
    .item img { width: 30px; height: 40px; object-fit: cover; border-radius: 2px; background: #000; }
    .empty { text-align: center; padding: 20px; color: #888; font-size: 12px; }
  </style>
</head>
<body>
  <h1>Scan Downloader Global</h1>
  
  <div class="loading" id="loading">Analyse de la page et chargement des images en cours...<br><small>(Cela peut prendre quelques secondes)</small></div>
  
  <div id="mainUI" style="display:none;">
      <div class="info" id="info">...</div>
      <div class="options">
        <label>Format:
          <select id="selFormat" style="background:#444;color:white;border:none;padding:2px;">
            <option value="webp">WebP</option>
            <option value="jpeg">JPEG</option>
          </select>
        </label>
        <label>Qualite: <input type="range" id="rangeQuality" min="50" max="100" value="80" style="width:80px;"> <span id="lblQuality">80%</span></label>
      </div>
      <div class="controls">
        <button id="btnSelectAll">Tout cocher</button>
        <button id="btnSelectNone">Tout decocher</button>
      </div>
      <div id="list"></div>
      <button id="btnDownload" class="btn-download" disabled>Telecharger</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
